{# shared admin section nav — included on settings, users, invites pages #}
{% with n=request.resolver_match.url_name %}
<nav class="admin-tabs">
  <a href="{% url 'accounts:school_settings' %}" class="{% if n == 'school_settings' %}active{% endif %}">Settings</a>
  <a href="{% url 'accounts:manage_users' %}" class="{% if n == 'manage_users' %}active{% endif %}">Users</a>
  <a href="{% url 'accounts:invite_list' %}" class="{% if n == 'invite_list' or n == 'invite_user' %}active{% endif %}">Invites</a>
</nav>
{% endwith %}
